name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (decode binary assets)
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest lib _site/
          cd _binary && find . -name '*.b64' | while read f; do o="../_site/${f%.b64}"; mkdir -p "$(dirname "$o")"; base64 -d "$f" > "$o"; done
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
